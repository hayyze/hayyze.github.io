<main class="container main-content">
    <div class="card">
        <div class="section-header">
            <h2><i class="fa-solid fa-calculator"></i> حاسبة المعدل الموزون</h2>
            <p class="section-desc">احسب معدلك من 100 حسب أوزان وزارة التعليم</p>
        </div>

        <div class="gpa-controls">
            <div class="option-field">
                <label>السنة الدراسية</label>
                <select id="year-select">
                    <option value="1">أول ثانوي</option>
                    <option value="2">ثاني ثانوي</option>
                    <option value="3">ثالث ثانوي (قريباً)</option>
                </select>
            </div>
            <div class="option-field">
                <label>الترم</label>
                <select id="term-select">
                    <option value="1">الترم الأول</option>
                    <option value="2">الترم الثاني</option>
                </select>
            </div>
        </div>

        <div id="subjects-container" class="subjects-list"></div>

        <div class="gpa-result hidden" id="gpa-result">
            <div class="gpa-score" id="gpa-score">0.00</div>
            <div class="gpa-label">المعدل الموزون من 100</div>
        </div>

        <div class="controls-row" style="margin-top: 24px;">
            <button class="btn btn-primary" id="calculate-btn"><i class="fa-solid fa-calculator"></i> احسب المعدل</button>
            <button class="btn btn-outline" id="reset-gpa-btn"><i class="fa-solid fa-rotate-right"></i> إعادة تعيين</button>
        </div>
    </div>
