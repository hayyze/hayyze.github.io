<main class="container main-content">
    <div class="card pomodoro-card">
        <div class="section-header">
            <h2><i class="fa-solid fa-clock"></i> مؤقت المذاكرة</h2>
            <p class="section-desc">استخدم تقنية بومودورو لزيادة تركيزك</p>
        </div>

        <div class="timer-settings">
            <div class="setting-item">
                <label><i class="fa-solid fa-book-open"></i> وقت الدراسة</label>
                <div class="input-with-unit">
                    <input type="number" id="work-minutes" min="1" max="120" value="25">
                    <span>دقيقة</span>
                </div>
            </div>
            <div class="setting-item">
                <label><i class="fa-solid fa-mug-hot"></i> وقت الراحة</label>
                <div class="input-with-unit">
                    <input type="number" id="break-minutes" min="1" max="60" value="5">
                    <span>دقيقة</span>
                </div>
            </div>
        </div>

        <div class="timer-mode-selector">
            <button class="mode-btn active" id="mode-work"><i class="fa-solid fa-brain"></i> دراسة</button>
            <button class="mode-btn" id="mode-break"><i class="fa-solid fa-coffee"></i> راحة</button>
        </div>

        <div class="timer-display-wrapper">
            <div class="timer-display" id="timer-display">25:00</div>
            <div class="timer-progress"><div class="progress-bar" id="timer-progress-bar"></div></div>
        </div>

        <div class="controls-row">
            <button class="btn btn-primary btn-lg" id="timer-start-btn"><i class="fa-solid fa-play"></i> تشغيل</button>
            <button class="btn btn-secondary" id="timer-pause-btn"><i class="fa-solid fa-pause"></i> إيقاف</button>
            <button class="btn btn-outline" id="timer-reset-btn"><i class="fa-solid fa-rotate-right"></i> إعادة</button>
        </div>

        <div class="sessions-info">
            <div class="session-badge">
                <i class="fa-solid fa-circle-check"></i>
                <span>الجلسات المكتملة: <strong id="completed-sessions-count">0</strong></span>
            </div>
        </div>
    </div>
