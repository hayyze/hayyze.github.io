<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متتبع العادات | حيز</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">

<header class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo">
            <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <span class="logo-text">حيز</span>
        </a>
        <button class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <nav class="nav-links" id="nav-links">
            <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> الرئيسية</a>
            <a href="pomodoro.html" class="nav-btn"><i class="fa-solid fa-clock"></i> المؤقت</a>
            <a href="todo.html" class="nav-btn"><i class="fa-solid fa-list-check"></i> المهام</a>
            <a href="gpa.html" class="nav-btn"><i class="fa-solid fa-calculator"></i> حاسبة المعدل</a>
            <a href="notes.html" class="nav-btn"><i class="fa-solid fa-note-sticky"></i> الملاحظات</a>
            <a href="habits.html" class="nav-btn active"><i class="fa-solid fa-fire"></i> العادات</a>
            <a href="game.html" class="nav-btn"><i class="fa-solid fa-gamepad"></i> لعبة الحروف</a>
            <a href="about.html" class="nav-btn"><i class="fa-solid fa-circle-info"></i> عن حيز</a>
        </nav>
        <div class="nav-actions">
            <button id="theme-toggle" class="theme-btn"><i class="fa-solid fa-moon"></i></button>
        </div>
    </div>
</header>

<main class="container main-content">
    <div class="card">
        <div class="section-header">
            <h2><i class="fa-solid fa-fire"></i> متتبع العادات الدراسية</h2>
            <p class="section-desc">ابنِ عادات يومية وتتبع استمرارك</p>
        </div>

        <form id="habit-form" class="habit-form">
            <div class="input-group">
                <input type="text" id="habit-input" placeholder="أضف عادة جديدة..." required>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> إضافة</button>
            </div>
        </form>

        <div class="habits-stats">
            <div class="habit-stat">
                <span class="habit-stat-num" id="total-habits">0</span>
                <span>عادات نشطة</span>
            </div>
            <div class="habit-stat">
                <span class="habit-stat-num" id="best-streak">0</span>
                <span>أفضل سلسلة</span>
            </div>
            <div class="habit-stat">
                <span class="habit-stat-num" id="today-completed">0</span>
                <span>مكتملة اليوم</span>
            </div>
        </div>

        <div id="habits-list" class="habits-list"></div>
        <div class="habits-empty hidden" id="habits-empty">
            <i class="fa-solid fa-seedling"></i>
            <p>ابدأ بإضافة عادتك الأولى</p>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container footer-container">
        <div class="footer-brand"><i class="fa-solid fa-graduation-cap"></i> حيز</div>
        <p class="footer-copy">&copy; 2026 حيز</p>
    </div>
</footer>

<script src="common.js"></script>
<script src="habits.js"></script>
</body>
</html>
