    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مساحة كتابة حرة | حيز</title>
    <meta name="description" content="مساحة كتابة ورسم حرة للطلاب مع دعم Apple Pencil، نص، ممحاة، تراجع، تكبير وتصغير، صفحات متعددة وحفظ محلي.">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --board: #f8f6f0;
            --toolbar-bg: rgba(255, 255, 255, 0.94);
            --text: #1e293b;
            --muted: #64748b;
            --border: rgba(0, 0, 0, 0.1);
            --primary: #4f46e5;
            --card: #ffffff;
        }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: var(--board); color: var(--text);
            -webkit-user-select: none; user-select: none;
        }
        body.drawing-mode { touch-action: none; }
        body.dark,
        body.theme-dark {
            --board: #0f172a;
            --toolbar-bg: rgba(30, 41, 59, 0.94);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
            --card: #1e293b;
        }

        /* ——— شاشة قائمة المساحات ——— */
        #hub {
            position: fixed; inset: 0; z-index: 500;
            background: #f4f6f9; overflow-y: auto;
            -webkit-user-select: text; user-select: text;
            touch-action: auto;
        }
        body.dark #hub,
        body.theme-dark #hub { background: #0f172a; }
        .hub-inner {
            max-width: 720px; margin: 0 auto; padding: 24px 16px 60px;
        }
        .hub-header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .hub-header h1 {
            font-size: 1.45rem; display: flex; align-items: center; gap: 10px;
        }
        .hub-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .hub-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 16px; border-radius: 12px; border: none;
            font-weight: 600; font-size: 0.95rem; cursor: pointer;
            font-family: inherit; transition: 0.2s;
        }
        .hub-btn-primary { background: var(--primary); color: #fff; }
        .hub-btn-primary:hover { filter: brightness(1.08); }
        .hub-btn-outline {
            background: transparent; border: 1px solid var(--border); color: var(--text);
        }
        .hub-btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .hub-search {
            position: relative; margin-bottom: 18px;
        }
        .hub-search i {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            color: var(--muted); pointer-events: none;
        }
        .hub-search input {
            width: 100%; padding: 12px 42px 12px 14px;
            border: 1px solid var(--border); border-radius: 12px;
            background: var(--card); color: var(--text);
            font-family: inherit; font-size: 1rem; outline: none;
        }
        .hub-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }
        .space-list { display: flex; flex-direction: column; gap: 10px; }
        .space-card {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px; border-radius: 14px;
            background: var(--card); border: 1px solid var(--border);
            cursor: pointer; transition: 0.2s; text-align: right;
        }
        .space-card:hover { border-color: var(--primary); box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .space-card .icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #c084fc);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0;
        }
        .space-card .info { flex: 1; min-width: 0; }
        .space-card .title {
            font-weight: 700; font-size: 1.05rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .space-card .meta { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
        .space-card .del {
            border: none; background: transparent; color: var(--muted);
            width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
            font-size: 1rem; flex-shrink: 0;
        }
        .space-card .del:hover { background: rgba(239,68,68,0.12); color: #ef4444; }
        .hub-empty {
            text-align: center; padding: 48px 16px; color: var(--muted);
        }
        .hub-empty i { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }
        .hub-empty p { margin-bottom: 18px; }

        /* مودال إنشاء / تسمية */
        #nameModal {
            display: none; position: fixed; inset: 0; z-index: 600;
            background: rgba(0,0,0,0.4); align-items: center; justify-content: center;
            padding: 16px;
        }
        #nameModal.open { display: flex; }
        .modal-box {
            background: var(--card); color: var(--text);
            border-radius: 16px; padding: 24px; width: 100%; max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .modal-box h2 { font-size: 1.2rem; margin-bottom: 8px; }
        .modal-box p { font-size: 0.9rem; color: var(--muted); margin-bottom: 14px; }
        .modal-box input {
            width: 100%; padding: 12px 14px; border: 1px solid var(--border);
            border-radius: 12px; background: transparent; color: var(--text);
            font-family: inherit; font-size: 1rem; outline: none; margin-bottom: 16px;
        }
        .modal-box input:focus { border-color: var(--primary); }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-start; }
        .modal-actions .hub-btn { flex: 1; justify-content: center; }

        /* ——— وضع الرسم ومساحة العمل ——— */
        #editor { display: none; position: fixed; inset: 0; }
        #editor.active { display: block; }

        #bgCanvas, #drawCanvas {
            position: fixed; inset: 0; display: block;
            width: 100%; height: 100%;
        }
        #bgCanvas { z-index: 1; pointer-events: none; }
        #drawCanvas {
            z-index: 2; touch-action: none; cursor: crosshair;
            background: transparent;
        }

        #toolbar {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            z-index: 200; display: flex; align-items: center; gap: 6px;
            padding: 6px 10px; border: 1px solid var(--border); border-radius: 16px;
            background: var(--toolbar-bg); box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            max-width: calc(100% - 16px); overflow-x: auto; scrollbar-width: none; direction: rtl;
        }
        #toolbar::-webkit-scrollbar { display: none; }
        .tool-btn {
            border: 0; background: transparent; min-width: 38px; height: 38px;
            padding: 0 8px; border-radius: 10px; font-size: 15px; font-family: inherit;
            color: inherit; cursor: pointer; display: inline-flex; align-items: center;
            justify-content: center; transition: background 0.15s, transform 0.1s; white-space: nowrap;
        }
        .tool-btn:hover { background: rgba(127,127,127,0.14); }
        .tool-btn:active { transform: scale(0.94); }
        .tool-btn.active { background: rgba(79, 70, 229, 0.18); color: var(--primary); font-weight: 700; }
        .tool-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .sep { width: 1px; height: 26px; background: currentColor; opacity: 0.12; flex-shrink: 0; }
        .color-wrap { position: relative; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; }
        #colorPicker { position: absolute; inset: 0; opacity: 0; cursor: pointer; border: 0; padding: 0; }
        #colorPreview { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(127,127,127,0.35); pointer-events: none; }
        #sizePicker { width: 72px; height: 28px; cursor: pointer; accent-color: var(--primary); }
        select.tool-select {
            border: 1px solid var(--border); background: transparent; color: inherit;
            border-radius: 10px; height: 36px; padding: 0 8px; font-size: 13px;
            font-family: inherit; cursor: pointer; outline: none;
        }
        .page-indicator { font-size: 13px; font-weight: 600; min-width: 48px; text-align: center; opacity: 0.85; }
        .zoom-display { font-size: 13px; font-weight: 600; min-width: 46px; text-align: center; }
        .save-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; opacity: 0; transition: opacity 0.3s; }
        .save-dot.show { opacity: 1; }
        .space-name-label {
            font-size: 12px; font-weight: 600; max-width: 100px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            opacity: 0.75; padding: 0 4px;
        }
        #pageBar {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            z-index: 200; display: flex; align-items: center; gap: 8px;
            padding: 8px 14px; border: 1px solid var(--border); border-radius: 14px;
            background: var(--toolbar-bg); box-shadow: 0 6px 24px rgba(0,0,0,0.1);
            backdrop-filter: blur(14px);
        }

        /* تحرير الملاحظة النصية المحددة */
        #textEditorOverlay {
            position: fixed; z-index: 350; display: none; background: transparent;
        }
        #textInput {
            position: absolute; inset: 0; width: 100%; height: 100%; min-width: 160px; min-height: 48px;
            padding: 8px 12px; border: 2px solid var(--primary); border-radius: 8px;
            font-size: 18px; font-family: inherit; background: #ffffff; color: #111111;
            outline: none; box-shadow: 0 4px 20px rgba(0,0,0,0.15); direction: rtl;
            resize: none; -webkit-user-select: text; user-select: text;
        }
        body.dark #textInput, body.theme-dark #textInput { background: #1e293b; color: #f1f5f9; }

        .back-link {
            position: fixed; top: 12px; right: 12px; z-index: 210; width: 42px; height: 42px;
            border-radius: 12px; border: 1px solid var(--border); background: var(--toolbar-bg);
            color: inherit; display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            cursor: pointer;
        }
        @media (max-width: 700px) {
            #sizePicker { width: 56px; }
            .space-name-label { display: none; }
            .back-link { top: auto; bottom: 16px; right: 12px; }
        }
    </style>
</head>
<body>
    <!-- قائمة المساحات -->
    <div id="hub">
        <div class="hub-inner">
            <div class="hub-header">
                <h1><i class="fa-solid fa-pen-nib" style="color:#7c3aed"></i> مساحات الكتابة الحرة</h1>
                <div class="hub-actions">
                    <a href="notes.html" class="hub-btn hub-btn-outline"><i class="fa-solid fa-arrow-right"></i> الملاحظات</a>
                    <button type="button" class="hub-btn hub-btn-primary" id="btnNewSpace"><i class="fa-solid fa-plus"></i> مساحة جديدة</button>
                </div>
            </div>
            <div class="hub-search" id="hubSearchWrap" style="display:none;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" id="hubSearch" placeholder="ابحث بالاسم..." autocomplete="off">
            </div>
            <div class="space-list" id="spaceList"></div>
            <div class="hub-empty hidden" id="hubEmpty">
                <i class="fa-solid fa-book-open"></i>
                <p>لا توجد مساحات بعد. أنشئ أول مساحة كتابة حرة.</p>
                <button type="button" class="hub-btn hub-btn-primary" id="btnNewSpaceEmpty"><i class="fa-solid fa-plus"></i> إنشاء مساحة</button>
            </div>
        </div>
    </div>

    <!-- مودال التسمية -->
    <div id="nameModal">
        <div class="modal-box">
            <h2 id="modalTitle">مساحة جديدة</h2>
            <p>اختر اسماً للمساحة أو اتركه فارغاً لتصبح «بلا عنوان»</p>
            <input type="text" id="modalNameInput" placeholder="اسم المساحة (اختياري)" maxlength="80" autocomplete="off">
            <div class="modal-actions">
                <button type="button" class="hub-btn hub-btn-primary" id="modalConfirm">إنشاء</button>
                <button type="button" class="hub-btn hub-btn-outline" id="modalCancel">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- المحرر -->
    <div id="editor">
        <button type="button" class="back-link" id="btnBackHub" title="قائمة المساحات"><i class="fa-solid fa-bars"></i></button>

        <div id="toolbar">
            <span class="space-name-label" id="spaceNameLabel"></span>
            <div class="sep"></div>
            <button class="tool-btn" id="btnSelect" type="button" title="تحديد / تحريك العناصر (S)"><i class="fa-solid fa-arrow-pointer"></i></button>
            <button class="tool-btn" id="btnPan" type="button" title="تحريك المساحة (H)"><i class="fa-solid fa-hand"></i></button>
            <button class="tool-btn active" id="btnPen" type="button" title="قلم (P)">✏️</button>
            <button class="tool-btn" id="btnText" type="button" title="نص (T)">T</button>
            <button class="tool-btn" id="btnEraser" type="button" title="ممحاة (E)">🧽</button>
            <div class="sep"></div>
            <button class="tool-btn" id="btnUndo" type="button" title="تراجع" disabled>↶</button>
            <button class="tool-btn" id="btnRedo" type="button" title="إعادة" disabled>↷</button>
            <div class="sep"></div>
            <button class="tool-btn" id="btnZoomOut" type="button" title="تصغير (−)"><i class="fa-solid fa-minus"></i></button>
            <button class="tool-btn" id="btnZoomReset" type="button" title="إعادة تعيين 100%"><span class="zoom-display" id="zoomLabel">100%</span></button>
            <button class="tool-btn" id="btnZoomIn" type="button" title="تكبير (+)"><i class="fa-solid fa-plus"></i></button>
            <div class="sep"></div>
            <div class="color-wrap" title="اللون">
                <div id="colorPreview"></div>
                <input id="colorPicker" type="color" value="#1e293b" aria-label="لون">
            </div>
            <input id="sizePicker" type="range" min="1" max="40" value="3" title="السماكة" aria-label="سماكة">
            <div class="sep"></div>
            <select id="bgPicker" class="tool-select" title="خلفية الورقة" aria-label="خلفية">
                <option value="plain">ورق عادي</option>
                <option value="lined">مسطر</option>
                <option value="grid">شبكة</option>
                <option value="dotted">نقطي</option>
                <option value="dark">داكن</option>
            </select>
            <div class="sep"></div>
            <select id="inputMode" class="tool-select" title="وضع الإدخال" aria-label="الإدخال">
                <option value="pen-only">قلم فقط</option>
                <option value="all">قلم + لمس</option>
            </select>
            <div class="sep"></div>
            <button class="tool-btn" id="btnRename" type="button" title="إعادة تسمية">📝</button>
            <button class="tool-btn" id="btnClear" type="button" title="مسح الصفحة">مسح</button>
            <span class="save-dot" id="saveDot" title="تم الحفظ"></span>
        </div>

        <canvas id="bgCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
        <div id="textEditorOverlay">
            <textarea id="textInput" autocomplete="off" enterkeyhint="done" placeholder="اكتب نصاً..."></textarea>
        </div>

        <div id="pageBar">
            <button class="tool-btn" id="btnPrevPage" type="button" title="السابق">‹</button>
            <span class="page-indicator" id="pageLabel">1 / 1</span>
            <button class="tool-btn" id="btnNextPage" type="button" title="التالي">›</button>
            <button class="tool-btn" id="btnAddPage" type="button" title="صفحة جديدة">＋</button>
            <button class="tool-btn" id="btnDelPage" type="button" title="حذف الصفحة">🗑</button>
        </div>
    </div>

    <script>
    (function () {
        const STORAGE_KEY = 'hayyiz-free-spaces-v1';
        const PREFS_KEY = 'hayyiz-draw-prefs';

        // عناصر القائمة
        const hub = document.getElementById('hub');
        const spaceList = document.getElementById('spaceList');
        const hubEmpty = document.getElementById('hubEmpty');
        const hubSearchWrap = document.getElementById('hubSearchWrap');
        const hubSearch = document.getElementById('hubSearch');
        const btnNewSpace = document.getElementById('btnNewSpace');
        const btnNewSpaceEmpty = document.getElementById('btnNewSpaceEmpty');
        const nameModal = document.getElementById('nameModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalNameInput = document.getElementById('modalNameInput');
        const modalConfirm = document.getElementById('modalConfirm');
        const modalCancel = document.getElementById('modalCancel');

        // عناصر المحرر
        const editor = document.getElementById('editor');
        const bgCanvas = document.getElementById('bgCanvas');
        const drawCanvas = document.getElementById('drawCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const ctx = drawCanvas.getContext('2d', { willReadFrequently: true });
        const textEditorOverlay = document.getElementById('textEditorOverlay');
        const textInput = document.getElementById('textInput');
        const btnSelect = document.getElementById('btnSelect');
        const btnPan = document.getElementById('btnPan');
        const btnPen = document.getElementById('btnPen');
        const btnText = document.getElementById('btnText');
        const btnEraser = document.getElementById('btnEraser');
        const btnUndo = document.getElementById('btnUndo');
        const btnRedo = document.getElementById('btnRedo');
        const btnZoomOut = document.getElementById('btnZoomOut');
        const btnZoomReset = document.getElementById('btnZoomReset');
        const btnZoomIn = document.getElementById('btnZoomIn');
        const zoomLabel = document.getElementById('zoomLabel');
        const btnClear = document.getElementById('btnClear');
        const btnRename = document.getElementById('btnRename');
        const btnPrevPage = document.getElementById('btnPrevPage');
        const btnNextPage = document.getElementById('btnNextPage');
        const btnAddPage = document.getElementById('btnAddPage');
        const btnDelPage = document.getElementById('btnDelPage');
        const btnBackHub = document.getElementById('btnBackHub');
        const pageLabel = document.getElementById('pageLabel');
        const spaceNameLabel = document.getElementById('spaceNameLabel');
        const colorPicker = document.getElementById('colorPicker');
        const colorPreview = document.getElementById('colorPreview');
        const sizePicker = document.getElementById('sizePicker');
        const bgPicker = document.getElementById('bgPicker');
        const inputModeEl = document.getElementById('inputMode');
        const saveDot = document.getElementById('saveDot');

        // ——— حالة التطبيق والنظام الهندسي لمساحة العمل ———
        let spaces = [];           // [{ id, name, pages, pageIndex, bgStyle, updated, metadata }]
        let activeSpaceId = null;
        let tool = 'pen';          // select | pan | pen | text | eraser
        let penColor = '#1e293b';
        let penSize = 3;
        let inputMode = 'pen-only';
        let drawing = false;
        let currentStroke = null;
        let saveTimer = null;
        let dpr = 1;
        let modalMode = 'create';  // create | rename

        // ——— الكاميرا والإحداثيات (Camera Engine) ———
        let zoomLevel = 1.0;       // 0.5 .. 2.0 (50% .. 200%)
        let panX = 0;              // إزاحة الشاشة بالبكسل
        let panY = 0;
        let isPanning = false;
        let panStartScreen = { x: 0, y: 0 };
        let panStartCamera = { x: 0, y: 0 };

        // ——— إدارة النصوص والتحديد ———
        let selectedTextId = null;
        let draggingTextObj = null;
        let dragTextOffset = { x: 0, y: 0 };
        let activeEditingText = null; // النص الجاري تعديله حالياً

        // ——— دعم إيماءات اللمس اللوحي (Pinch-to-zoom & Touch Pan) ———
        let activePointers = new Map();
        let initialPinchDistance = null;
        let initialPinchZoom = 1.0;
        let initialPinchCenterWS = null;

        function uid(prefix) {
            return (prefix || 's_') + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
        }

        function emptyPage() {
            return { strokes: [], texts: [], history: [], future: [] };
        }

        // ——— تحويل الإحداثيات بين الشاشة ومساحة العمل ———
        function screenToWorkspace(screenX, screenY) {
            return {
                x: (screenX - panX) / zoomLevel,
                y: (screenY - panY) / zoomLevel
            };
        }

        function workspaceToScreen(wsX, wsY) {
            return {
                x: wsX * zoomLevel + panX,
                y: wsY * zoomLevel + panY
            };
        }

        // ——— تحميل البيانات القديمة وتوافقيها ———
        function loadAll() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    spaces = (data.spaces || []).map(function (s) {
                        return {
                            id: s.id || uid(),
                            name: (s.name && s.name.trim()) ? s.name.trim() : 'بلا عنوان',
                            metadata: s.metadata || {},
                            pages: (s.pages || [emptyPage()]).map(function (p) {
                                return {
                                    strokes: p.strokes || [],
                                    texts: (p.texts || []).map(function (t) {
                                        return {
                                            id: t.id || uid('t_'),
                                            text: t.text || '',
                                            x: t.x || 0,
                                            y: t.y || 0,
                                            color: t.color || '#1e293b',
                                            size: t.size || 18,
                                            fontFamily: t.fontFamily || "'Segoe UI', Tahoma, Arial, sans-serif"
                                        };
                                    }),
                                    history: [],
                                    future: []
                                };
                            }),
                            pageIndex: s.pageIndex || 0,
                            bgStyle: s.bgStyle || 'plain',
                            updated: s.updated || Date.now()
                        };
                    });
                    if (!spaces.length) {
                        migrateOld();
                    }
                } else {
                    migrateOld();
                }
            } catch (e) {
                spaces = [];
            }
            try {
                const prefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
                penColor = prefs.penColor || '#1e293b';
                penSize = prefs.penSize || 3;
                inputMode = prefs.inputMode || 'pen-only';
            } catch (e) {}
            colorPicker.value = penColor;
            colorPreview.style.background = penColor;
            sizePicker.value = penSize;
            inputModeEl.value = inputMode;
        }

        function migrateOld() {
            try {
                const old = localStorage.getItem('hayyiz-free-notes-v2');
                if (!old) return;
                const data = JSON.parse(old);
                if (!data.pages || !data.pages.length) return;
                spaces.push({
                    id: uid(),
                    name: 'بلا عنوان',
                    metadata: {},
                    pages: data.pages.map(function (p) {
                        return {
                            strokes: p.strokes || [],
                            texts: (p.texts || []).map(function (t) {
                                return {
                                    id: t.id || uid('t_'),
                                    text: t.text || '',
                                    x: t.x || 0,
                                    y: t.y || 0,
                                    color: t.color || '#1e293b',
                                    size: t.size || 18,
                                    fontFamily: t.fontFamily || "'Segoe UI', Tahoma, Arial, sans-serif"
                                };
                            }),
                            history: [],
                            future: []
                        };
                    }),
                    pageIndex: data.pageIndex || 0,
                    bgStyle: data.bgStyle || 'plain',
                    updated: data.updated || Date.now()
                });
                localStorage.removeItem('hayyiz-free-notes-v2');
            } catch (e) {}
        }

        function saveAll() {
            try {
                const slim = spaces.map(function (s) {
                    return {
                        id: s.id,
                        name: s.name,
                        metadata: s.metadata || {},
                        pages: s.pages.map(function (p) {
                            return {
                                strokes: p.strokes,
                                texts: p.texts.map(function (t) {
                                    return {
                                        id: t.id,
                                        text: t.text,
                                        x: t.x,
                                        y: t.y,
                                        color: t.color,
                                        size: t.size,
                                        fontFamily: t.fontFamily
                                    };
                                })
                            };
                        }),
                        pageIndex: s.pageIndex,
                        bgStyle: s.bgStyle,
                        updated: s.updated
                    };
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ spaces: slim }));
                saveDot.classList.add('show');
                clearTimeout(saveTimer);
                saveTimer = setTimeout(function () { saveDot.classList.remove('show'); }, 1000);
            } catch (e) {
                console.warn('حفظ فشل', e);
            }
        }

        function savePrefs() {
            try {
                localStorage.setItem(PREFS_KEY, JSON.stringify({
                    penColor: penColor, penSize: penSize, inputMode: inputMode
                }));
            } catch (e) {}
        }

        function scheduleSave() {
            if (activeSpaceId) {
                const s = getActiveSpace();
                if (s) s.updated = Date.now();
            }
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveAll, 450);
        }

        function getActiveSpace() {
            return spaces.find(function (s) { return s.id === activeSpaceId; }) || null;
        }

        function currentPage() {
            const s = getActiveSpace();
            if (!s) return emptyPage();
            if (s.pageIndex < 0 || s.pageIndex >= s.pages.length) s.pageIndex = 0;
            return s.pages[s.pageIndex];
        }

        // ——— القائمة (Hub) ———
        function formatDate(ts) {
            try {
                return new Date(ts).toLocaleString('ar-EG', {
                    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                });
            } catch (e) { return ''; }
        }

        function renderHub(filter) {
            filter = (filter || '').trim().toLowerCase();
            const sorted = spaces.slice().sort(function (a, b) {
                return (b.updated || 0) - (a.updated || 0);
            });
            const list = filter
                ? sorted.filter(function (s) {
                    return (s.name || '').toLowerCase().indexOf(filter) !== -1;
                })
                : sorted;

            spaceList.innerHTML = '';
            if (!spaces.length) {
                hubEmpty.classList.remove('hidden');
                hubSearchWrap.style.display = 'none';
                return;
            }
            hubEmpty.classList.add('hidden');
            hubSearchWrap.style.display = spaces.length >= 2 ? 'block' : 'none';

            if (!list.length) {
                spaceList.innerHTML = '<p style="text-align:center;color:var(--muted);padding:24px;">لا نتائج للبحث</p>';
                return;
            }

            list.forEach(function (s) {
                const card = document.createElement('div');
                card.className = 'space-card';
                card.innerHTML =
                    '<div class="icon"><i class="fa-solid fa-pen-nib"></i></div>' +
                    '<div class="info">' +
                        '<div class="title"></div>' +
                        '<div class="meta"></div>' +
                    '</div>' +
                    '<button type="button" class="del" title="حذف" aria-label="حذف"><i class="fa-solid fa-trash"></i></button>';
                card.querySelector('.title').textContent = s.name || 'بلا عنوان';
                const pagesCount = (s.pages && s.pages.length) || 1;
                card.querySelector('.meta').textContent =
                    pagesCount + ' صفحة · آخر تعديل ' + formatDate(s.updated);

                card.addEventListener('click', function (e) {
                    if (e.target.closest('.del')) return;
                    openSpace(s.id);
                });
                card.querySelector('.del').addEventListener('click', function (e) {
                    e.stopPropagation();
                    if (!confirm('حذف المساحة «' + (s.name || 'بلا عنوان') + '»؟')) return;
                    spaces = spaces.filter(function (x) { return x.id !== s.id; });
                    saveAll();
                    renderHub(hubSearch.value);
                });
                spaceList.appendChild(card);
            });
        }

        function showHub() {
            editor.classList.remove('active');
            hub.style.display = 'block';
            document.body.classList.remove('drawing-mode');
            activeSpaceId = null;
            hideTextEditor();
            applySiteTheme();
            renderHub(hubSearch.value);
        }

        function openSpace(id) {
            const s = spaces.find(function (x) { return x.id === id; });
            if (!s) return;
            activeSpaceId = id;
            if (s.pageIndex >= s.pages.length) s.pageIndex = 0;
            bgPicker.value = s.bgStyle || 'plain';
            spaceNameLabel.textContent = s.name || 'بلا عنوان';

            // إعادة ضبط الكاميرا
            zoomLevel = 1.0;
            panX = 0;
            panY = 0;
            updateZoomDisplay();

            hub.style.display = 'none';
            editor.classList.add('active');
            document.body.classList.add('drawing-mode');
            applySiteTheme();

            if (isSiteDark() || s.bgStyle === 'dark') {
                if (penColor === '#1e293b' || penColor === '#111111') {
                    penColor = '#f1f5f9';
                    colorPicker.value = penColor;
                    colorPreview.style.background = penColor;
                }
            } else {
                if (penColor === '#f1f5f9' || penColor === '#ffffff') {
                    penColor = '#1e293b';
                    colorPicker.value = penColor;
                    colorPreview.style.background = penColor;
                }
            }
            resizeCanvases();
            setTool('pen');
        }

        function openNameModal(mode, preset) {
            modalMode = mode;
            modalTitle.textContent = mode === 'rename' ? 'إعادة تسمية' : 'مساحة جديدة';
            modalConfirm.textContent = mode === 'rename' ? 'حفظ' : 'إنشاء';
            modalNameInput.value = preset || '';
            nameModal.classList.add('open');
            setTimeout(function () { modalNameInput.focus(); }, 50);
        }

        function closeNameModal() {
            nameModal.classList.remove('open');
            modalNameInput.value = '';
        }

        function createSpace(name) {
            name = (name || '').trim() || 'بلا عنوان';
            const s = {
                id: uid(),
                name: name,
                metadata: {},
                pages: [emptyPage()],
                pageIndex: 0,
                bgStyle: 'plain',
                updated: Date.now()
            };
            spaces.unshift(s);
            saveAll();
            openSpace(s.id);
        }

        function renameActive(name) {
            const s = getActiveSpace();
            if (!s) return;
            s.name = (name || '').trim() || 'بلا عنوان';
            s.updated = Date.now();
            spaceNameLabel.textContent = s.name;
            saveAll();
        }

        btnNewSpace.addEventListener('click', function () { openNameModal('create'); });
        btnNewSpaceEmpty.addEventListener('click', function () { openNameModal('create'); });
        btnRename.addEventListener('click', function () {
            const s = getActiveSpace();
            openNameModal('rename', s ? s.name : '');
        });
        modalCancel.addEventListener('click', closeNameModal);
        nameModal.addEventListener('click', function (e) {
            if (e.target === nameModal) closeNameModal();
        });
        modalConfirm.addEventListener('click', function () {
            const name = modalNameInput.value;
            closeNameModal();
            if (modalMode === 'rename') renameActive(name);
            else createSpace(name);
        });
        modalNameInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                modalConfirm.click();
            } else if (e.key === 'Escape') closeNameModal();
        });
        hubSearch.addEventListener('input', function () {
            renderHub(hubSearch.value);
        });
        btnBackHub.addEventListener('click', showHub);

        // ——— سجل التراجع والإعادة (Undo/Redo Engine) ———
        function pushHistory() {
            const p = currentPage();
            p.history.push({
                strokes: JSON.parse(JSON.stringify(p.strokes)),
                texts: JSON.parse(JSON.stringify(p.texts))
            });
            if (p.history.length > 30) p.history.shift();
            p.future = [];
            updateUndoRedo();
        }

        function undo() {
            const p = currentPage();
            if (!p.history.length) return;
            p.future.push({
                strokes: JSON.parse(JSON.stringify(p.strokes)),
                texts: JSON.parse(JSON.stringify(p.texts))
            });
            const prev = p.history.pop();
            p.strokes = prev.strokes;
            p.texts = prev.texts;
            selectedTextId = null;
            redrawContent();
            updateUndoRedo();
            scheduleSave();
        }

        function redo() {
            const p = currentPage();
            if (!p.future.length) return;
            p.history.push({
                strokes: JSON.parse(JSON.stringify(p.strokes)),
                texts: JSON.parse(JSON.stringify(p.texts))
            });
            const next = p.future.pop();
            p.strokes = next.strokes;
            p.texts = next.texts;
            selectedTextId = null;
            redrawContent();
            updateUndoRedo();
            scheduleSave();
        }

        function updateUndoRedo() {
            const p = currentPage();
            btnUndo.disabled = !p.history.length;
            btnRedo.disabled = !p.future.length;
        }

        // ——— طبقة الرسم + ثيم الموقع ———
        function isSiteDark() {
            return localStorage.getItem('hayyiz-theme') === 'dark';
        }

        function applySiteTheme() {
            var dark = isSiteDark();
            document.body.classList.toggle('theme-dark', dark);
            document.body.classList.toggle('dark', dark);
            var hubEl = document.getElementById('hub');
            if (hubEl) {
                hubEl.style.background = dark ? '#0f172a' : '#f4f6f9';
            }
        }

        // ——— رسم الخلفية في إحداثيات مساحة العمل المتكيفة ———
        function drawBackground() {
            const w = bgCanvas.width / dpr;
            const h = bgCanvas.height / dpr;
            const s = getActiveSpace();
            var bgStyle = (s && s.bgStyle) || bgPicker.value || 'plain';
            var dark = isSiteDark();

            if (bgStyle === 'dark') {
                dark = true;
            }

            bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            bgCtx.clearRect(0, 0, w, h);

            document.body.classList.toggle('dark', dark);
            document.body.classList.toggle('theme-dark', dark);

            if (dark) {
                bgCtx.fillStyle = '#0f172a';
            } else {
                bgCtx.fillStyle = '#f8f6f0';
            }
            bgCtx.fillRect(0, 0, w, h);

            if (bgStyle === 'plain') return;

            bgCtx.setTransform(dpr * zoomLevel, 0, 0, dpr * zoomLevel, dpr * panX, dpr * panY);

            const wsLeft = -panX / zoomLevel;
            const wsTop = -panY / zoomLevel;
            const wsRight = (w - panX) / zoomLevel;
            const wsBottom = (h - panY) / zoomLevel;

            bgCtx.strokeStyle = dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.07)';
            bgCtx.lineWidth = 1 / zoomLevel;

            const step = 28;
            const startX = Math.floor(wsLeft / step) * step;
            const endX = Math.ceil(wsRight / step) * step;
            const startY = Math.floor(wsTop / step) * step;
            const endY = Math.ceil(wsBottom / step) * step;

            if (bgStyle === 'lined' || (dark && bgStyle === 'dark')) {
                if (bgStyle === 'lined') {
                    for (let y = startY; y <= endY; y += step) {
                        bgCtx.beginPath();
                        bgCtx.moveTo(wsLeft, y);
                        bgCtx.lineTo(wsRight, y);
                        bgCtx.stroke();
                    }
                }
            } else if (bgStyle === 'grid') {
                for (let x = startX; x <= endX; x += step) {
                    bgCtx.beginPath();
                    bgCtx.moveTo(x, wsTop);
                    bgCtx.lineTo(x, wsBottom);
                    bgCtx.stroke();
                }
                for (let y = startY; y <= endY; y += step) {
                    bgCtx.beginPath();
                    bgCtx.moveTo(wsLeft, y);
                    bgCtx.lineTo(wsRight, y);
                    bgCtx.stroke();
                }
            } else if (bgStyle === 'dotted') {
                bgCtx.fillStyle = dark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.12)';
                const dotStep = 24;
                const dStartX = Math.floor(wsLeft / dotStep) * dotStep;
                const dEndX = Math.ceil(wsRight / dotStep) * dotStep;
                const dStartY = Math.floor(wsTop / dotStep) * dotStep;
                const dEndY = Math.ceil(wsBottom / dotStep) * dotStep;
                const radius = 1.2 / zoomLevel;

                for (let x = dStartX; x <= dEndX; x += dotStep) {
                    for (let y = dStartY; y <= dEndY; y += dotStep) {
                        bgCtx.beginPath();
                        bgCtx.arc(x, y, radius, 0, Math.PI * 2);
                        bgCtx.fill();
                    }
                }
            }
        }

        // ——— أبعاد وقياسات النص للمحاذاة والتحديد ———
        function getTextMetrics(t) {
            ctx.save();
            const fontSize = t.size || 18;
            ctx.font = fontSize + "px 'Segoe UI', Tahoma, Arial, sans-serif";
            const lines = (t.text || '').split('\n');
            let maxW = 0;
            lines.forEach(function (l) {
                const metrics = ctx.measureText(l);
                if (metrics.width > maxW) maxW = metrics.width;
            });
            ctx.restore();
            const lineHeight = fontSize * 1.3;
            const h = lines.length * lineHeight;
            return {
                width: Math.max(maxW, 40),
                height: Math.max(h, fontSize),
                lineHeight: lineHeight,
                lines: lines
            };
        }

        // ——— رسم نص محدد مع حدود وأدوات تحكم ———
        function renderTextObject(t, isSelected) {
            const metrics = getTextMetrics(t);
            const fontSize = t.size || 18;
            ctx.font = fontSize + "px 'Segoe UI', Tahoma, Arial, sans-serif";
            ctx.fillStyle = t.color || (isSiteDark() ? '#f1f5f9' : '#1e293b');
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';

            const lines = metrics.lines;
            for (let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i], t.x, t.y + i * metrics.lineHeight);
            }

            // إطار التحديد والأزرار
            if (isSelected) {
                ctx.save();
                ctx.strokeStyle = '#4f46e5';
                ctx.lineWidth = 1.5 / zoomLevel;
                ctx.setLineDash([4 / zoomLevel, 3 / zoomLevel]);

                const pad = 6 / zoomLevel;
                const rectX = t.x - metrics.width - pad;
                const rectY = t.y - pad;
                const rectW = metrics.width + pad * 2;
                const rectH = metrics.height + pad * 2;

                ctx.strokeRect(rectX, rectY, rectW, rectH);
                ctx.setLineDash([]);

                // مقبض الحذف
                const delBtnRadius = 10 / zoomLevel;
                const delBtnX = rectX;
                const delBtnY = rectY;

                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(delBtnX, delBtnY, delBtnRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2 / zoomLevel;
                ctx.beginPath();
                ctx.moveTo(delBtnX - 4 / zoomLevel, delBtnY - 4 / zoomLevel);
                ctx.lineTo(delBtnX + 4 / zoomLevel, delBtnY + 4 / zoomLevel);
                ctx.moveTo(delBtnX + 4 / zoomLevel, delBtnY - 4 / zoomLevel);
                ctx.lineTo(delBtnX - 4 / zoomLevel, delBtnY + 4 / zoomLevel);
                ctx.stroke();

                ctx.restore();
            }
        }

        function redrawContent() {
            const w = drawCanvas.width / dpr;
            const h = drawCanvas.height / dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);

            ctx.setTransform(dpr * zoomLevel, 0, 0, dpr * zoomLevel, dpr * panX, dpr * panY);

            const p = currentPage();
            var i, s, t, j, pt;

            for (i = 0; i < p.strokes.length; i++) {
                s = p.strokes[i];
                if (!s.points || s.points.length < 1) continue;
                ctx.beginPath();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                if (s.tool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.strokeStyle = 'rgba(0,0,0,1)';
                    ctx.lineWidth = s.size * 2.5;
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = s.color;
                    ctx.lineWidth = s.size;
                }
                ctx.moveTo(s.points[0].x, s.points[0].y);
                for (j = 1; j < s.points.length; j++) {
                    pt = s.points[j];
                    if (pt.pressure != null && s.tool !== 'eraser') {
                        ctx.lineWidth = s.size * (0.4 + pt.pressure * 0.9);
                    }
                    ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();
            }
            ctx.globalCompositeOperation = 'source-over';

            for (i = 0; i < p.texts.length; i++) {
                t = p.texts[i];
                renderTextObject(t, t.id === selectedTextId);
            }
            updatePageLabel();
            updateUndoRedo();
        }

        function fullRedraw() {
            drawBackground();
            redrawContent();
        }

        function resizeCanvases() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            var w = Math.floor(window.innerWidth * dpr);
            var h = Math.floor(window.innerHeight * dpr);
            bgCanvas.width = w; bgCanvas.height = h;
            drawCanvas.width = w; drawCanvas.height = h;
            bgCanvas.style.width = window.innerWidth + 'px';
            bgCanvas.style.height = window.innerHeight + 'px';
            drawCanvas.style.width = window.innerWidth + 'px';
            drawCanvas.style.height = window.innerHeight + 'px';
            fullRedraw();
        }

        // ——— أدوات التحكم والتكبير والتحريك ———
        function setTool(name) {
            tool = name;
            btnSelect.classList.toggle('active', name === 'select');
            btnPan.classList.toggle('active', name === 'pan');
            btnPen.classList.toggle('active', name === 'pen');
            btnText.classList.toggle('active', name === 'text');
            btnEraser.classList.toggle('active', name === 'eraser');

            if (name === 'pan') {
                drawCanvas.style.cursor = 'grab';
            } else if (name === 'select') {
                drawCanvas.style.cursor = 'default';
            } else if (name === 'text') {
                drawCanvas.style.cursor = 'text';
            } else {
                drawCanvas.style.cursor = 'crosshair';
            }

            if (name !== 'select') {
                if (selectedTextId) {
                    selectedTextId = null;
                    redrawContent();
                }
            }
            hideTextEditor();
        }

        function setZoom(newZoom, anchorScreenX, anchorScreenY) {
            const clamped = Math.min(Math.max(0.5, newZoom), 2.0);
            if (Math.abs(clamped - zoomLevel) < 0.001) return;

            const anchorX = anchorScreenX != null ? anchorScreenX : window.innerWidth / 2;
            const anchorY = anchorScreenY != null ? anchorScreenY : window.innerHeight / 2;

            const wsBefore = screenToWorkspace(anchorX, anchorY);
            zoomLevel = Math.round(clamped * 100) / 100;

            panX = anchorX - wsBefore.x * zoomLevel;
            panY = anchorY - wsBefore.y * zoomLevel;

            updateZoomDisplay();
            fullRedraw();
        }

        function updateZoomDisplay() {
            if (zoomLabel) {
                zoomLabel.textContent = Math.round(zoomLevel * 100) + '%';
            }
        }

        btnZoomIn.addEventListener('click', function () { setZoom(zoomLevel + 0.25); });
        btnZoomOut.addEventListener('click', function () { setZoom(zoomLevel - 0.25); });
        btnZoomReset.addEventListener('click', function () {
            zoomLevel = 1.0;
            panX = 0;
            panY = 0;
            updateZoomDisplay();
            fullRedraw();
        });

        function canDraw(e) {
            if (e.pointerType === 'mouse') return true;
            if (inputMode === 'pen-only') return e.pointerType === 'pen';
            return true;
        }

        // ——— فحص التفاعل مع أزرار وعناصر النص ———
        function hitTestText(wsPos) {
            const p = currentPage();
            const pad = 8;
            for (let i = p.texts.length - 1; i >= 0; i--) {
                const t = p.texts[i];
                const metrics = getTextMetrics(t);
                const rectX = t.x - metrics.width - pad;
                const rectY = t.y - pad;
                const rectW = metrics.width + pad * 2;
                const rectH = metrics.height + pad * 2;

                if (wsPos.x >= rectX && wsPos.x <= rectX + rectW &&
                    wsPos.y >= rectY && wsPos.y <= rectY + rectH) {
                    return t;
                }
            }
            return null;
        }

        function hitTestDeleteBtn(t, wsPos) {
            if (!t) return false;
            const metrics = getTextMetrics(t);
            const pad = 6 / zoomLevel;
            const rectX = t.x - metrics.width - pad;
            const rectY = t.y - pad;
            const delBtnX = rectX;
            const delBtnY = rectY;
            const r = 14 / zoomLevel;

            const dx = wsPos.x - delBtnX;
            const dy = wsPos.y - delBtnY;
            return (dx * dx + dy * dy) <= r * r;
        }

        // ——— تحرير وإنشاء النصوص أفقياً ورأسياً ———
        function showTextEditor(textObj, wsX, wsY) {
            activeEditingText = textObj;
            const scr = workspaceToScreen(wsX, wsY);

            textEditorOverlay.style.display = 'block';
            textEditorOverlay.style.left = Math.max(10, Math.min(scr.x - 180, window.innerWidth - 220)) + 'px';
            textEditorOverlay.style.top = Math.max(10, Math.min(scr.y - 10, window.innerHeight - 100)) + 'px';
            textEditorOverlay.style.width = '200px';
            textEditorOverlay.style.height = '80px';

            textInput.value = textObj ? textObj.text : '';
            textInput.style.color = textObj ? textObj.color : penColor;

            requestAnimationFrame(function () {
                textInput.focus();
                textInput.select();
            });
        }

        function hideTextEditor() {
            textEditorOverlay.style.display = 'none';
            activeEditingText = null;
        }

        function commitTextEditor() {
            const val = (textInput.value || '').trim();
            if (!val && activeEditingText) {
                // حذف النص الفارغ
                pushHistory();
                const p = currentPage();
                p.texts = p.texts.filter(function (x) { return x.id !== activeEditingText.id; });
                selectedTextId = null;
                redrawContent();
                scheduleSave();
            } else if (val) {
                pushHistory();
                const p = currentPage();
                if (activeEditingText) {
                    activeEditingText.text = val;
                    activeEditingText.color = penColor;
                } else {
                    const scrX = parseFloat(textEditorOverlay.style.left) + 180;
                    const scrY = parseFloat(textEditorOverlay.style.top) + 10;
                    const wsPos = screenToWorkspace(scrX, scrY);
                    const newObj = {
                        id: uid('t_'),
                        text: val,
                        x: wsPos.x,
                        y: wsPos.y,
                        color: penColor,
                        size: Math.max(14, penSize * 4),
                        fontFamily: "'Segoe UI', Tahoma, Arial, sans-serif"
                    };
                    p.texts.push(newObj);
                    selectedTextId = newObj.id;
                }
                redrawContent();
                scheduleSave();
            }
            hideTextEditor();
        }

        textInput.addEventListener('keydown', function (e) {
            e.stopPropagation();
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                commitTextEditor();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                hideTextEditor();
            }
        });

        textInput.addEventListener('blur', function () {
            setTimeout(function () {
                if (document.activeElement !== textInput && textEditorOverlay.style.display === 'block') {
                    commitTextEditor();
                }
            }, 150);
        });

        textEditorOverlay.addEventListener('pointerdown', function (e) {
            e.stopPropagation();
        });

        // ——— الأحداث والمستشعرات للرسم والتكبير والتحريك ———
        drawCanvas.addEventListener('pointerdown', function (e) {
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });

            // اللمس المزدوج Pinch-to-zoom أو Pan باللمس
            if (activePointers.size === 2 && e.pointerType === 'touch') {
                const pts = Array.from(activePointers.values());
                const dx = pts[1].x - pts[0].x;
                const dy = pts[1].y - pts[0].y;
                initialPinchDistance = Math.hypot(dx, dy);
                initialPinchZoom = zoomLevel;
                const centerScrX = (pts[0].x + pts[1].x) / 2;
                const centerScrY = (pts[0].y + pts[1].y) / 2;
                initialPinchCenterWS = screenToWorkspace(centerScrX, centerScrY);
                drawing = false;
                isPanning = false;
                return;
            }

            const wsPos = screenToWorkspace(e.clientX, e.clientY);

            // أداة التحريك (Pan)
            if (tool === 'pan' || e.button === 1 || (e.pointerType === 'touch' && inputMode === 'pen-only' && tool !== 'select')) {
                isPanning = true;
                panStartScreen = { x: e.clientX, y: e.clientY };
                panStartCamera = { x: panX, y: panY };
                drawCanvas.style.cursor = 'grabbing';
                drawCanvas.setPointerCapture(e.pointerId);
                return;
            }

            // أداة التحديد (Select)
            if (tool === 'select') {
                const p = currentPage();
                const selObj = p.texts.find(function (t) { return t.id === selectedTextId; });

                if (selObj && hitTestDeleteBtn(selObj, wsPos)) {
                    pushHistory();
                    p.texts = p.texts.filter(function (t) { return t.id !== selObj.id; });
                    selectedTextId = null;
                    redrawContent();
                    scheduleSave();
                    return;
                }

                const clickedText = hitTestText(wsPos);
                if (clickedText) {
                    if (selectedTextId === clickedText.id && e.detail === 2) {
                        // النقر المزدوج للتعديل
                        showTextEditor(clickedText, clickedText.x, clickedText.y);
                        return;
                    }
                    selectedTextId = clickedText.id;
                    draggingTextObj = clickedText;
                    dragTextOffset = {
                        x: wsPos.x - clickedText.x,
                        y: wsPos.y - clickedText.y
                    };
                    pushHistory();
                    drawCanvas.setPointerCapture(e.pointerId);
                    redrawContent();
                } else {
                    selectedTextId = null;
                    redrawContent();
                }
                return;
            }

            // أداة النص (Text)
            if (tool === 'text') {
                if (!canDraw(e)) return;
                e.preventDefault();
                const existing = hitTestText(wsPos);
                if (existing) {
                    selectedTextId = existing.id;
                    showTextEditor(existing, existing.x, existing.y);
                } else {
                    showTextEditor(null, wsPos.x, wsPos.y);
                }
                return;
            }

            // أداة الرسم أو الممحاة
            if (!canDraw(e)) return;
            e.preventDefault();
            drawing = true;
            drawCanvas.setPointerCapture(e.pointerId);
            pushHistory();

            currentStroke = {
                tool: tool,
                color: penColor,
                size: penSize,
                points: [{
                    x: wsPos.x,
                    y: wsPos.y,
                    pressure: (e.pressure > 0 && e.pressure < 1) ? e.pressure : 0.5
                }]
            };
            currentPage().strokes.push(currentStroke);
        });

        drawCanvas.addEventListener('pointermove', function (e) {
            if (activePointers.has(e.pointerId)) {
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
            }

            // معالجة pinch-to-zoom اللمسي
            if (activePointers.size === 2 && initialPinchDistance && initialPinchCenterWS) {
                const pts = Array.from(activePointers.values());
                const dx = pts[1].x - pts[0].x;
                const dy = pts[1].y - pts[0].y;
                const dist = Math.hypot(dx, dy);
                if (dist > 10) {
                    const targetZoom = initialPinchZoom * (dist / initialPinchDistance);
                    const centerScrX = (pts[0].x + pts[1].x) / 2;
                    const centerScrY = (pts[0].y + pts[1].y) / 2;
                    setZoom(targetZoom, centerScrX, centerScrY);
                }
                return;
            }

            // معالجة التحريك (Pan)
            if (isPanning) {
                const dx = e.clientX - panStartScreen.x;
                const dy = e.clientY - panStartScreen.y;
                panX = panStartCamera.x + dx;
                panY = panStartCamera.y + dy;
                fullRedraw();
                return;
            }

            // معالجة سحب النص (Drag Text)
            if (draggingTextObj && tool === 'select') {
                const wsPos = screenToWorkspace(e.clientX, e.clientY);
                draggingTextObj.x = wsPos.x - dragTextOffset.x;
                draggingTextObj.y = wsPos.y - dragTextOffset.y;
                redrawContent();
                return;
            }

            // معالجة رسم الخط
            if (!drawing || !currentStroke) return;
            e.preventDefault();
            const wsPos = screenToWorkspace(e.clientX, e.clientY);
            const pressure = (e.pressure > 0 && e.pressure < 1) ? e.pressure : 0.5;
            currentStroke.points.push({ x: wsPos.x, y: wsPos.y, pressure: pressure });

            const pts = currentStroke.points;
            if (pts.length < 2) return;
            const a = workspaceToScreen(pts[pts.length - 2].x, pts[pts.length - 2].y);
            const b = workspaceToScreen(pts[pts.length - 1].x, pts[pts.length - 1].y);

            ctx.save();
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.beginPath();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (currentStroke.tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
                ctx.lineWidth = currentStroke.size * 2.5 * zoomLevel;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentStroke.color;
                ctx.lineWidth = currentStroke.size * (0.4 + pressure * 0.9) * zoomLevel;
            }
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
            ctx.restore();
        });

        function endPointer(e) {
            activePointers.delete(e.pointerId);
            if (activePointers.size < 2) {
                initialPinchDistance = null;
                initialPinchCenterWS = null;
            }

            if (isPanning) {
                isPanning = false;
                drawCanvas.style.cursor = tool === 'pan' ? 'grab' : (tool === 'select' ? 'default' : 'crosshair');
                try { drawCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
            }

            if (draggingTextObj) {
                draggingTextObj = null;
                try { drawCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
                scheduleSave();
            }

            if (drawing) {
                drawing = false;
                currentStroke = null;
                try { drawCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
                if (tool === 'eraser') redrawContent();
                scheduleSave();
            }
        }

        drawCanvas.addEventListener('pointerup', endPointer);
        drawCanvas.addEventListener('pointercancel', endPointer);
        drawCanvas.addEventListener('pointerleave', function (e) {
            if (drawing || isPanning || draggingTextObj) endPointer(e);
        });

        // عجلة الماوس للتكبير والتحريك (Wheel Zoom & Pan)
        drawCanvas.addEventListener('wheel', function (e) {
            e.preventDefault();
            if (e.ctrlKey || e.metaKey) {
                // Zoom
                const factor = e.deltaY < 0 ? 1.1 : 0.9;
                setZoom(zoomLevel * factor, e.clientX, e.clientY);
            } else {
                // Pan
                panX -= e.deltaX;
                panY -= e.deltaY;
                fullRedraw();
            }
        }, { passive: false });

        // ——— إدارة الصفحات والأدوات ———
        function updatePageLabel() {
            const s = getActiveSpace();
            if (!s) return;
            pageLabel.textContent = (s.pageIndex + 1) + ' / ' + s.pages.length;
            btnPrevPage.disabled = s.pageIndex <= 0;
            btnNextPage.disabled = s.pageIndex >= s.pages.length - 1;
            btnDelPage.disabled = s.pages.length <= 1;
        }

        function goPage(i) {
            const s = getActiveSpace();
            if (!s || i < 0 || i >= s.pages.length) return;
            s.pageIndex = i;
            selectedTextId = null;
            fullRedraw();
            scheduleSave();
        }

        btnSelect.addEventListener('click', function () { setTool('select'); });
        btnPan.addEventListener('click', function () { setTool('pan'); });
        btnPen.addEventListener('click', function () { setTool('pen'); });
        btnText.addEventListener('click', function () { setTool('text'); });
        btnEraser.addEventListener('click', function () { setTool('eraser'); });
        btnUndo.addEventListener('click', undo);
        btnRedo.addEventListener('click', redo);

        btnClear.addEventListener('click', function () {
            if (!confirm('مسح هذه الصفحة بالكامل؟')) return;
            pushHistory();
            var p = currentPage();
            p.strokes = [];
            p.texts = [];
            selectedTextId = null;
            redrawContent();
            scheduleSave();
        });

        btnPrevPage.addEventListener('click', function () {
            const s = getActiveSpace();
            if (s) goPage(s.pageIndex - 1);
        });
        btnNextPage.addEventListener('click', function () {
            const s = getActiveSpace();
            if (s) goPage(s.pageIndex + 1);
        });
        btnAddPage.addEventListener('click', function () {
            const s = getActiveSpace();
            if (!s) return;
            s.pages.splice(s.pageIndex + 1, 0, emptyPage());
            goPage(s.pageIndex + 1);
        });
        btnDelPage.addEventListener('click', function () {
            const s = getActiveSpace();
            if (!s || s.pages.length <= 1) return;
            if (!confirm('حذف هذه الصفحة؟')) return;
            s.pages.splice(s.pageIndex, 1);
            if (s.pageIndex >= s.pages.length) s.pageIndex = s.pages.length - 1;
            fullRedraw();
            scheduleSave();
        });

        colorPicker.addEventListener('input', function () {
            penColor = colorPicker.value;
            colorPreview.style.background = penColor;
            if (selectedTextId) {
                const p = currentPage();
                const t = p.texts.find(function (x) { return x.id === selectedTextId; });
                if (t) {
                    pushHistory();
                    t.color = penColor;
                    redrawContent();
                    scheduleSave();
                }
            }
            savePrefs();
        });
        sizePicker.addEventListener('input', function () {
            penSize = Number(sizePicker.value);
            savePrefs();
        });
        bgPicker.addEventListener('change', function () {
            const s = getActiveSpace();
            if (s) {
                s.bgStyle = bgPicker.value;
                s.updated = Date.now();
            }
            if (bgPicker.value === 'dark') {
                localStorage.setItem('hayyiz-theme', 'dark');
            }
            applySiteTheme();
            drawBackground();
            scheduleSave();
        });
        inputModeEl.addEventListener('change', function () {
            inputMode = inputModeEl.value;
            savePrefs();
        });

        // اختصارات لوحة المفاتيح
        window.addEventListener('keydown', function (e) {
            if (e.target === textInput || e.target === modalNameInput || e.target === hubSearch) return;
            if (!editor.classList.contains('active')) return;

            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedTextId) {
                    e.preventDefault();
                    pushHistory();
                    const p = currentPage();
                    p.texts = p.texts.filter(function (t) { return t.id !== selectedTextId; });
                    selectedTextId = null;
                    redrawContent();
                    scheduleSave();
                }
            } else if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                if (e.shiftKey) redo(); else undo();
            } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                e.preventDefault();
                redo();
            } else if (e.key === 's' || e.key === 'S') setTool('select');
            else if (e.key === 'h' || e.key === 'H') setTool('pan');
            else if (e.key === 't' || e.key === 'T') setTool('text');
            else if (e.key === 'e' || e.key === 'E') setTool('eraser');
            else if (e.key === 'p' || e.key === 'P') setTool('pen');
            else if (e.key === '+' || e.key === '=') setZoom(zoomLevel + 0.25);
            else if (e.key === '-') setZoom(zoomLevel - 0.25);
            else if (e.key === '0') setZoom(1.0);
        });

        document.body.addEventListener('touchmove', function (e) {
            if (!document.body.classList.contains('drawing-mode')) return;
            if (e.target === drawCanvas || e.target === document.body) e.preventDefault();
        }, { passive: false });

        window.addEventListener('resize', function () {
            if (editor.classList.contains('active')) resizeCanvases();
        });
        window.addEventListener('beforeunload', function () {
            if (activeSpaceId) saveAll();
        });

        // ——— التشغيل والبدء ———
        loadAll();
        applySiteTheme();
        showHub();
    })();
    </script>
</body>
</html>
