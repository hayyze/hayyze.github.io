<main class="container main-content">
    <div class="card">
        <div class="section-header">
            <h2><i class="fa-solid fa-list-check"></i> قائمة المهام الدراسية</h2>
            <p class="section-desc">أضف مهامك وحدد أولوياتها وتواريخها</p>
        </div>
        
        <form id="todo-form" class="todo-form">
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="أضف مهمة جديدة..." required>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> إضافة</button>
            </div>
            <div class="todo-options">
                <div class="option-field">
                    <label>الأولوية</label>
                    <select id="todo-priority">
                        <option value="low">منخفضة</option>
                        <option value="medium" selected>متوسطة</option>
                        <option value="high">عالية</option>
                    </select>
                </div>
                <div class="option-field">
                    <label>تاريخ الاستحقاق</label>
                    <input type="datetime-local" id="todo-date">
                </div>
                <div class="option-field">
                    <label>المدة المتوقعة (دقيقة)</label>
                    <input type="number" id="todo-minutes" min="1" max="1440" placeholder="مثال: 45">
                </div>
            </div>
        </form>

        <div class="todo-filters">
            <button class="filter-btn active" data-filter="all">الكل</button>
            <button class="filter-btn" data-filter="active">نشطة</button>
            <button class="filter-btn" data-filter="completed">مكتملة</button>
            <button class="filter-btn" data-filter="high">عالية الأولوية</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>
        <div class="todo-empty hidden" id="todo-empty">
            <i class="fa-solid fa-clipboard-list"></i>
            <p>لا توجد مهام بعد</p>
        </div>
    </div>
</main>
