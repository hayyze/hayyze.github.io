name: Prepare Hayiz User Site

on:
  push:
    branches:
      - migration-hayiz-usersite

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update absolute site URLs
        shell: bash
        run: |
          set -euo pipefail
          OLD='https://just-c.github.io/adawati'
          NEW='https://hayiz.github.io'

          matches=$(grep -rl --exclude-dir=.git -- "$OLD" . || true)
          if [ -n "$matches" ]; then
            while IFS= read -r file; do
              sed -i "s|$OLD|$NEW|g" "$file"
            done <<< "$matches"
          fi

      - name: Commit migration changes and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-hayiz-usersite.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes found.'
            exit 0
          fi
          git commit -m 'Prepare site URLs for Hayiz User Site'
          git push
