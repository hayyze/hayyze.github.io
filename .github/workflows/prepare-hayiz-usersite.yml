name: Prepare Hayiz User Site

on:
  push:
    branches:
      - migration-hayiz-usersite

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite old Pages URLs
        run: |
          set -euo pipefail
          OLD='https://just-c.github.io/adawati'
          NEW='https://hayiz.github.io'
          files=$(grep -rl --exclude-dir=.git -- "$OLD" . || true)
          if [ -n "$files" ]; then
            while IFS= read -r f; do sed -i "s|$OLD|$NEW|g" "$f"; done <<< "$files"
          fi
      - name: Update branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-hayiz-usersite.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prepare site for Hayiz User Site'
          git push
