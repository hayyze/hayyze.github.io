name: Validate Hayyiz
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: hayyiz-test-only
          POSTGRES_DB: hayyiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: hayyiz-test-only
      PGDATABASE: hayyiz_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bootstrap isolated Auth roles and verify database boundaries
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/bootstrap-postgres-test.sql
          git show origin/main:supabase-schema-and-security.sql > "$RUNNER_TEMP/hayyiz-base-schema.sql"
          psql -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/hayyiz-base-schema.sql"
          node scripts/build-verified-migration.cjs supabase/account-security-integrity.sql > "$RUNNER_TEMP/hayyiz-verified-migration.sql"
          psql -v ON_ERROR_STOP=1 --single-transaction -f "$RUNNER_TEMP/hayyiz-verified-migration.sql"
          psql -v ON_ERROR_STOP=1 -f scripts/test-database-security.sql
          psql -v ON_ERROR_STOP=1 --single-transaction -f supabase/migrations/20261031064000_rpc_and_profile_privacy_hardening.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-database-security.sql
      - name: Verify schema can be reapplied without breaking permissions
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase-schema-and-security.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-database-security.sql
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: for file in *.js; do node --check "$file"; done
      - name: Run all regression and security tests
        run: node scripts/run-tests.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/hayyiz-browser" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/hayyiz-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify student workflow and offline app shell
        run: NODE_PATH="$RUNNER_TEMP/hayyiz-browser/node_modules" node scripts/browser-smoke.cjs
