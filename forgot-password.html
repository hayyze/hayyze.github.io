<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://dzfdbjnqtgltuguqqdkz.supabase.co; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>استعادة كلمة المرور | حيز</title>
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="password-recovery.css">
    <script src="password-recovery-theme.js"></script>
</head>
<body class="password-recovery-page">
    <main class="password-recovery-layout">
        <section class="password-recovery-card" aria-labelledby="recovery-title">
            <a class="password-recovery-brand" href="index.html" aria-label="العودة إلى حيز">
                <span class="password-recovery-mark" aria-hidden="true">ح</span>
                <span class="password-recovery-brand-copy">
                    <strong>حيز</strong>
                    <small>مساحة أكثر هدوءًا لتنظيم يومك</small>
                </span>
            </a>

            <div class="password-recovery-heading">
                <span class="password-recovery-eyebrow">استعادة الحساب</span>
                <h1 id="recovery-title">نسيت كلمة المرور؟</h1>
                <p>أدخل البريد الإلكتروني المرتبط بحسابك. سنرسل إليك رابطًا آمنًا لتعيين كلمة مرور جديدة.</p>
            </div>

            <div id="password-recovery-request-status" class="password-recovery-status" role="status" aria-live="polite" aria-atomic="true" hidden></div>

            <form id="password-recovery-request-form" class="password-recovery-form" action="forgot-password.html" method="get" novalidate>
                <div class="password-recovery-field">
                    <label for="password-recovery-email">البريد الإلكتروني</label>
                    <input
                        id="password-recovery-email"
                        type="email"
                        inputmode="email"
                        autocomplete="email"
                        autocapitalize="none"
                        spellcheck="false"
                        maxlength="254"
                        placeholder="name@example.com"
                        dir="ltr"
                        required
                        aria-describedby="password-recovery-email-help">
                    <small id="password-recovery-email-help">تأكد من كتابة البريد الإلكتروني بشكل صحيح.</small>
                </div>

                <button id="password-recovery-request-button" class="password-recovery-submit" type="submit">
                    إرسال رابط الاستعادة
                </button>
            </form>

            <a class="password-recovery-back-link" href="index.html">العودة إلى تسجيل الدخول</a>
            <p class="password-recovery-privacy-note">لن نكشف ما إذا كان البريد الإلكتروني مسجلًا في حيز أم لا.</p>
        </section>
    </main>

    <script src="supabase.js"></script>
    <script src="password-recovery.js"></script>
</body>
</html>
