<html lang="ar" dir="rtl">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">

<header class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo">
            <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <span class="logo-text">حيز</span>
        </a>
        <button class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <nav class="nav-links" id="nav-links">
            <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> الرئيسية</a>
            <a href="pomodoro.html" class="nav-btn"><i class="fa-solid fa-clock"></i> المؤقت</a>
            <a href="todo.html" class="nav-btn"><i class="fa-solid fa-list-check"></i> المهام</a>
            <a href="gpa.html" class="nav-btn"><i class="fa-solid fa-calculator"></i> حاسبة المعدل</a>
            <a href="notes.html" class="nav-btn active"><i class="fa-solid fa-note-sticky"></i> الملاحظات</a>
            <a href="habits.html" class="nav-btn"><i class="fa-solid fa-fire"></i> العادات</a>
            <a href="game.html" class="nav-btn"><i class="fa-solid fa-gamepad"></i> لعبة الحروف</a>
            <a href="about.html" class="nav-btn"><i class="fa-solid fa-circle-info"></i> عن حيز</a>
        </nav>
        <div class="nav-actions">
            <button id="theme-toggle" class="theme-btn"><i class="fa-solid fa-moon"></i></button>
        </div>
    </div>
</header>

<main class="container main-content">
    <div class="card">
        <div class="section-header">
            <h2><i class="fa-solid fa-note-sticky"></i> دفتر الملاحظات</h2>
            <p class="section-desc">اكتب أفكارك وملاحظاتك الدراسية</p>
        </div>

        <form id="notes-form" class="notes-form">
            <input type="text" id="note-title" placeholder="عنوان الملاحظة (اختياري)">
            <textarea id="note-content" placeholder="اكتب ملاحظتك هنا..." rows="4" required></textarea>
            <div class="notes-actions">
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> حفظ</button>
                <button type="button" class="btn btn-outline" id="clear-note-btn">مسح</button>
            </div>
        </form>

        <div class="notes-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="notes-search" placeholder="ابحث في ملاحظاتك...">
        </div>

        <div id="notes-list" class="notes-grid"></div>
        <div class="notes-empty hidden" id="notes-empty">
            <i class="fa-solid fa-book-open"></i>
            <p>لا توجد ملاحظات بعد</p>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container footer-container">
        <div class="footer-brand">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>حيز</span>
        </div>
        <p class="footer-copy">&copy; 2026 حيز — جميع الحقوق محفوظة</p>

            <a href="privacy.html">سياسة الخصوصية</a>
            <a href="mailto:adawati.support@gmail.com">تواصل معنا</a>
        </div>
    </div>
</footer>

<script src="common.js"></script>
<script src="notes.js"></script>
</body>
</html>
